<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت آنلاین</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- سبک‌ها -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* مثال سبک سریع */
        body { font-family: Tahoma, sans-serif; margin:0; background:#f2f2f2; }
        .night { background:#222; color:#eee; }
        #chat { display:none; flex-direction:column; height:100vh; }
        #messages { flex:1; overflow-y:auto; padding:10px; }
        #text-and-file-area { display:flex; padding:5px; align-items:center; }
        #text { flex:1; padding:5px; resize:none; }
        #send-button { margin-left:5px; cursor:pointer; }
        .message { margin-bottom:10px; display:flex; }
        .self { justify-content:flex-end; }
        .other { justify-content:flex-start; }
        .message-body-content { max-width:70%; padding:8px; border-radius:10px; background:#fff; }
        .night .message-body-content { background:#444; color:#eee; }
        .bubble-tail { width:10px; height:10px; background:inherit; clip-path:polygon(0 0, 100% 50%, 0 100%); }
        #emoji-panel { display:none; flex-wrap:wrap; padding:5px; border-top:1px solid #ccc; background:#eee; }
        .night #emoji-panel { background:#333; border-color:#555; }
        #record-status { display:none; color:red; margin-left:10px; }
        #stop-recording-button { display:none; cursor:pointer; margin-left:5px; }
    </style>
</head>
<body id="htmlTag">

    <!-- لاگین -->
    <div id="login" style="padding:20px;">
        <h2>ورود به چت</h2>
        <input id="username" placeholder="نام کاربری" /><br><br>
        <input id="password" type="password" placeholder="رمز عبور" /><br><br>
        <button id="loginButton">ورود</button>
        <button id="registerButton">ثبت نام</button>

        <p id="loginMsg" style="color:red;"></p>
    </div>

    <!-- چت -->
    <div id="chat">
        <div style="padding:5px; display:flex; justify-content:space-between; align-items:center;">
            <span id="usernameDisplay"></span>
            <span id="typingStatus" style="display:none;"></span>
            <button id="themeToggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div id="messages"></div>

        <div id="emoji-panel"></div>

        <div id="text-and-file-area">
            <textarea id="text" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
            <input type="file" id="file"/>
            <button id="emoji-button" onclick="toggleEmojiPanel()">😊</button>
            <button id="record-button">🎙️</button>
            <button id="stop-recording-button">⏹️</button>
            <span id="record-status">در حال ضبط...</span>
            <button id="send-button" onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <!-- لودینگ آپلود -->
    <div id="loadingIndicator" style="display:none; position:fixed; top:10px; right:10px; background:#fff; padding:10px; border-radius:5px;">
        <span id="loadingText"></span>
        <div style="width:100px; height:5px; background:#ccc; margin-top:5px;">
            <div id="uploadProgress" style="height:100%; width:0%; background:green;"></div>
        </div>
    </div>

    <!-- فایل‌های JS -->
    <script type="module" src="js/core.js"></script>
    <script type="module" src="js/messageStatus.js"></script>
    <script type="module" src="js/typing.js"></script>
    <script type="module" src="js/uiHelpers.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/chatCore.js"></script>
    <script type="module" src="js/messageActions.js"></script>

</body>
</html>
